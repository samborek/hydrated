<!DOCTYPE html>
<html>
  <head>
    <title>GIGA Scroll Animation</title>
    <meta charset="UTF-8">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/ScrollTrigger.min.js"></script>
    <style>@font-face {
  font-family: Gazpacho;
  src: url("GazpachoMedium.6828d164.woff2") format("woff2");
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}

body {
  background-color: #000;
  min-height: 1500vh;
  margin: 0;
  padding: 0;
  overflow-x: hidden;
}

.scroll-container {
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 1vh;
  width: 100%;
  height: 100vh;
  display: flex;
  position: fixed;
  top: 0;
  left: 0;
}

.text {
  color: #fff;
  white-space: nowrap;
  opacity: 0;
  clip-path: inset(0);
  letter-spacing: .5rem;
  margin: 0;
  padding: 0;
  font-family: Gazpacho, sans-serif;
  font-size: clamp(8rem, 8vw, 8rem);
  font-weight: 500;
  line-height: .8;
  transform: translateY(20vh);
}

.svg-container {
  opacity: 0;
  background-color: #000;
  flex-direction: column;
  justify-content: space-around;
  align-items: center;
  width: 100%;
  height: 100%;
  display: flex;
  position: absolute;
  top: 0;
  left: 0;
}

.svg-row {
  justify-content: center;
  width: 100%;
  display: flex;
}

.svg-item {
  opacity: 0;
  clip-path: inset(0);
  justify-content: center;
  align-items: center;
  width: 120px;
  height: 120px;
  margin: 10px;
  display: flex;
  transform: scale(.8);
}

.svg-item svg {
  width: 100%;
  height: 100%;
}

.spacer {
  height: 1500vh;
}

.dot-text {
  opacity: 0;
  position: absolute;
}

.gidadot-text {
  color: #fff;
  white-space: nowrap;
  opacity: 0;
  transform-origin: center;
  text-align: center;
  letter-spacing: .5rem;
  mix-blend-mode: difference;
  width: 100%;
  font-family: Gazpacho, sans-serif;
  font-size: clamp(2rem, 4vw, 4rem);
  font-weight: 500;
  position: absolute;
}

.gidadot-container {
  opacity: 0;
  justify-content: center;
  align-items: center;
  width: 100%;
  height: 100%;
  display: flex;
  position: absolute;
  top: 0;
  left: 0;
}

.bg-transition {
  opacity: 0;
  pointer-events: none;
  background: #fff;
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0;
  left: 0;
}

.spiral-container {
  opacity: 0;
  justify-content: center;
  align-items: center;
  width: 100%;
  height: 100%;
  display: flex;
  position: absolute;
  top: 0;
  left: 0;
}

.spiral-svg-piece {
  opacity: 0;
  transform-origin: center;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.spiral-svg-wrapper {
  justify-content: center;
  align-items: center;
  width: 100%;
  height: 100%;
  display: flex;
  position: absolute;
  top: 0;
  left: 0;
}

.svg-background {
  filter: none;
}

.svg-dot {
  filter: blur();
}

.black-overlay {
  opacity: 0;
  z-index: 10;
  background-color: #000;
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0;
  left: 0;
}
</style>

    <div class="scroll-container"></div>
    <div class="spacer"></div>

    <script>gsap.registerPlugin(ScrollTrigger);
window.addEventListener("load", ()=>{
    const container = document.querySelector(".scroll-container");
    const numDuplicates = 10;
    const gigaTexts = [];
    const dotTexts = [];
    // Create GIDADOT container and text
    const gidadotContainer = document.createElement("div");
    gidadotContainer.className = "gidadot-container";

    const bgTransition = document.createElement("div");
    bgTransition.className = "bg-transition";
    gidadotContainer.appendChild(bgTransition);
    // Create multiple layers of GIDADOT for wave effect
    const numLayers = 5;
    const gidadotLayers = [];
    for(let i = 0; i < numLayers; i++){
        const layer = document.createElement("div");
        layer.className = "gidadot-text";
        layer.textContent = "GIDADOT";
        layer.style.position = 'absolute';
        gidadotContainer.appendChild(layer);
        gidadotLayers.push(layer);
    }
    // SVG markup for icons
    const svgMarkup = `<svg width="58" height="60" viewBox="-14.5 -15 58 60" fill="none" xmlns="http://www.w3.org/2000/svg">

        text.className = "text giga-text";
        text.textContent = "GIGA";
        container.appendChild(text);
        gigaTexts.push(text);
    }

    for(let i = 0; i < numDuplicates; i++){
        const text = document.createElement("div");
        text.className = "text dot-text";
        text.textContent = "DOT";
        text.style.position = "absolute";
        text.style.opacity = "0";
        container.appendChild(text);
        dotTexts.push(text);
    }
    // Create SVG container for the third animation
    const svgContainer = document.createElement("div");
    svgContainer.className = "svg-container";
    container.appendChild(svgContainer);
    // Create rows of SVGs
    const numRows = 8;
    const svgRows = [];
    const svgItems = [];
    for(let i = 0; i < numRows; i++){
        const row = document.createElement("div");
        row.className = "svg-row";
        svgContainer.appendChild(row);
        svgRows.push(row);
        // Calculate number of SVGs per row based on screen width
        const itemWidth = 140; // SVG width + margins (increased)
        const numItemsPerRow = Math.ceil(window.innerWidth / itemWidth);
        const rowItems = [];
        for(let j = 0; j < numItemsPerRow; j++){
            const item = document.createElement("div");
            item.className = "svg-item";
            item.innerHTML = svgMarkup;
            row.appendChild(item);
            rowItems.push(item);
            svgItems.push(item);

            const flickerTimeline = gsap.timeline({
                repeat: -1,
                yoyo: true
            });
            // Random flicker parameters for each SVG
            const flickerSpeed = 0.05 + Math.random() * 0.2; // Random duration between 0.05 and 0.25s
            const flickerDelay = Math.random() * 1.5; // Random start delay
            const flickerOpacity = 0.7 + Math.random() * 0.3; // Opacity fluctuation
            const flickerRotation = -2 + Math.random() * 4; // Small random rotation -2 to 2 degrees
            const flickerScale = 0.95 + Math.random() * 0.1; // Subtle scale change
            // Create a small randomized flicker animation that runs continuously
            flickerTimeline.to(item.querySelector('svg'), {
                opacity: flickerOpacity,
                rotation: flickerRotation,
                scale: flickerScale,
                duration: flickerSpeed,
                ease: "none"
            }).to(item.querySelector('svg'), {
                opacity: 1,
                rotation: 0,
                scale: 1,
                duration: flickerSpeed * 1.2,
                ease: "none"
            });
            // Start the flicker animation with a random delay
            flickerTimeline.progress(Math.random()).timeScale(0.7 + Math.random() * 0.6);
        }
        // Set initial transform for alternating rows
        const isEven = i % 2 === 0;
        rowItems.forEach((item, index)=>{
            gsap.set(item, {
                opacity: 0,
                scale: 1,
                clipPath: isEven ? "inset(0 100% 0 0)" : "inset(0 0 0 100%)" // Clip from sides
            });
        });
    }
    // Position DOT texts at the same positions as GIGA texts
    function updateDotPositions() {
        gigaTexts.forEach((giga, index)=>{
            const rect = giga.getBoundingClientRect();
            const dot = dotTexts[index];
            dot.style.top = `${rect.top}px`;
        });
    }
    // Set up scroll-based timeline
    const tl = gsap.timeline({
        scrollTrigger: {
            trigger: ".spacer",
            start: "top top",
            end: "bottom bottom",
            scrub: 1,
            pin: ".scroll-container",
            onUpdate: updateDotPositions
        }
    });

    gsap.set(gigaTexts, {
        opacity: 0,
        y: "20vh"
    });
    gsap.set(dotTexts, {
        opacity: 0,
        clipPath: "inset(0 0 100% 0)"
    });
    gsap.set(svgContainer, {
        opacity: 0
    });

    gigaTexts.forEach((text, index)=>{
        tl.to(text, {
            opacity: 1,
            y: 0,
            duration: 0.3
        }, index * 0.1);
        tl.to(text, {
            clipPath: "inset(100% 0 0 0)",
            opacity: 0,
            duration: 0.3,
            ease: "power2.in"
        }, ">+0.2");
    });
    // Second third - DOT animation
    dotTexts.forEach((text, index)=>{
        tl.to(text, {
            opacity: 1,
            clipPath: "inset(0 0 0 0)",
            duration: 0.3,
            ease: "power2.out"
        }, ">-0.1");
        tl.to(text, {
            clipPath: "inset(0 0 100% 0)",
            opacity: 0,
            duration: 0.3,
            ease: "power2.in"
        }, ">+0.2");
    });

    tl.to(gidadotContainer, {
        opacity: 1,
        duration: 0.3
    });

    tl.to(bgTransition, {
        opacity: 1,
        duration: 0.5,
        ease: "power2.inOut"
    }, ">");
    // Initial burst animation and individual layer animations
    gidadotLayers.forEach((layer, index)=>{

        gsap.set(layer, {
            scale: 0.5,
            opacity: 0,
            color: "white"
        });

        tl.to(layer, {
            scale: 1 + index * 0.5,
            opacity: 1,
            duration: 0.4,
            ease: "power2.out"
        }, `>-${index * 0.1}`);

        tl.to(layer, {
            color: "#000000",
            duration: 0.4,
            ease: "none"
        }, "<"); // Sync with burst
        // Add quick blinks (keeping black color)
        tl.to(layer, {
            opacity: 1,
            duration: 0.1,
            repeat: 1,
            yoyo: true,
            ease: "none"
        }, ">");
        // Wave effect (still black)
        tl.to(layer, {
            scale: 2 + index,
            rotation: index % 2 ? 5 : -5,
            duration: 0.6,
            ease: "power1.inOut"
        }, ">");
        // Change back to white before fade out
        tl.to(layer, {
            color: "white",
            duration: 0.2,
            ease: "none"
        }, ">-0.2");
        // Individual blur and fade out
        tl.to(layer, {
            scale: 4 + index,
            opacity: 0,
            filter: "blur(30px)",
            rotation: index % 2 ? 8 : -8,
            duration: 1,
            ease: "power2.inOut"
        }, ">-0.3");
    });
    // Fade out white background (slightly later)
    tl.to(bgTransition, {
        opacity: 0,
        duration: 1,
        ease: "power2.inOut"
    }, "<0.5");

    tl.to(gidadotContainer, {
        opacity: 0,
        duration: 0.3
    });

        duration: 0.5,
        onStart: function() {
            document.body.style.backgroundColor = "#000000";

            from: "start"

        ease: "power2.out"

        stagger: {

            from: "end"

        ease: "power2.out"

    });

        clipPath: "inset(100% 0 0 0)",
        opacity: 0,
        scale: 0.8,
        duration: 0.8,
        stagger: {
            each: 0.03,
            from: "start"
        },
        ease: "power2.in"
    }, ">");
    tl.to(oddRows.map((row)=>Array.from(row.children)).flat(), {

        opacity: 0,
        scale: 0.8,
        duration: 0.8,
        stagger: {
            each: 0.03,
            from: "end"
        },
        ease: "power2.in"
    }, "<" // Start at the same time as even rows
    );

    tl.to(svgContainer, {

        duration: 0.5,
        onComplete: function() {

        }
    });

    spiralContainer.className = "spiral-container";
    container.appendChild(spiralContainer);

    blackOverlay.className = "black-overlay";

        {
            path: "M16.9499 16.3484C18.1932 16.0152 19.3566 16.3319 19.5505 17.0555C19.7444 17.779 18.8931 18.6355 17.6518 18.9681C16.4085 19.3012 15.2451 18.9846 15.0512 18.261C14.8573 17.5375 15.7086 16.681 16.9499 16.3484Z",
            fill: "white"
        }
    ];
    // Create SVG pieces
    const svgPieces = [];
    svgPaths.forEach((pathData, index)=>{
        const piece = document.createElement("div");
        piece.className = "spiral-svg-piece";
        // Create SVG for this piece
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("width", "300");
        svg.setAttribute("height", "300");
        svg.setAttribute("viewBox", "-14.5 -15 58 60");
        // Create path for this piece
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", pathData.path);
        path.setAttribute("fill", pathData.fill);
        if (pathData.isBackground) path.classList.add("svg-background");
        else path.classList.add("svg-dot");
        svg.appendChild(path);
        piece.appendChild(svg);
        spiralWrapper.appendChild(piece);
        svgPieces.push(piece);
        // Set initial position - no x,y offset needed as we're using transform: translate
        gsap.set(piece, {
            opacity: 0,
            scale: pathData.isBackground ? 3 : 3
        });
    });
    // Calculate spiral path - separate for background and dots
    const backgroundPoint = {
        x: 0,
        y: 0
    };
    // Generate spiral points - flatten to 2D
    function generateSpiralPoints(numPoints, maxRadius) {
        const points = [];
        for(let i = 0; i < numPoints; i++){
            const t = i / (numPoints - 1); // 0 to 1
            const angle = 4 * Math.PI * 2 * t; // 4 full spiral turns
            const radius = maxRadius * t;
            const x = radius * Math.cos(angle);
            const y = radius * Math.sin(angle);
            points.push({
                x,
                y
            });
        }
        return points;
    }
    const dotSpiralPoints = generateSpiralPoints(svgPaths.length - 1, 500);
    // Start the spiral animation
    tl.to(spiralContainer, {
        opacity: 1,
        duration: 0.5
    });
    // Animate background to center
    tl.to(svgPieces[0], {
        opacity: 1,
        scale: 5,
        duration: 1.5,
        ease: "power2.inOut"
    });
    // Animate each dot along spiral path to its final position
    svgPieces.forEach((piece, index)=>{
        if (index === 0) return; // Skip background
        // Get spiral point for this piece
        const spiralPoint = dotSpiralPoints[index - 1];
        // Animate from spiral point to final position
        tl.to(piece, {
            opacity: 1,
            filter: "blur(20px)",
            duration: 0.5,
            ease: "power1.in"
        }, `<${index * 0.15}`);
        // Move along spiral - use transform for positioning
        tl.fromTo(piece, {
            x: spiralPoint.x,
            y: spiralPoint.y,
            scale: 1,
            rotation: Math.random() * 360,
            xPercent: -50,
            yPercent: -50
        }, {
            x: 0,
            y: 0,
            scale: 5,
            rotation: 0,
            filter: "blur(0px)",
            duration: 2.5,
            ease: "power2.inOut",
            xPercent: -50,
            yPercent: -50,
            onComplete: function() {
                // Add shake effect when piece lands
                gsap.to(piece, {
                    x: "+=5",
                    y: "+=5",
                    duration: 0.1,
                    repeat: 3,
                    yoyo: true,
                    ease: "none"
                });
            }
        }, `<${0.1}`);
    });
    // Hold the complete SVG for a moment
    tl.to({}, {
        duration: 1.5
    });
    // Scale up the complete SVG
    tl.to(spiralWrapper, {
        scale: 1.5,
        duration: 2,
        ease: "power2.inOut"
    });
    // Add subtle shake to the whole SVG
    tl.to(spiralWrapper, {
        x: "+=10",
        y: "+=10",
        duration: 0.2,
        repeat: 5,
        yoyo: true,
        ease: "none"
    }, "<");
    // Final fade out with subtle spin and blur
    tl.to(spiralWrapper, {
        opacity: 0.3,
        rotation: 15,
        scale: 2,
        filter: "blur(200px)",
        duration: 2,
        ease: "power3.in",
        onStart: function() {
            document.body.style.backgroundColor = "#000000";
        }
    });
    // Fade in black overlay at the same time
    tl.to(blackOverlay, {
        opacity: 1,
        duration: 1.5,
        ease: "power2.inOut"
    }, "<0.5");
    // Completely hide spiral container
    tl.to(spiralContainer, {
        opacity: 0,
        duration: 0.5
    }, "<0.8");
    // Hold black screen for a moment and ensure background stays black
    tl.to({}, {
        duration: 1,
        onComplete: function() {
            document.body.style.backgroundColor = "#000000";
        }
    });
});
