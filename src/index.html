<!DOCTYPE html>
<!DOCTYPE html>
<html>
  <head>
    <title>GIGA Scroll Animation</title>
    <meta charset="UTF-8" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
      @font-face {
        font-family: "Gazpacho";
        src: url("/GazpachoMedium.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: black;
        min-height: 100vh; /* Changed from 1000vh to ensure proper viewport height */
        overflow-x: hidden;
        width: 100%;
      }

      .scroll-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 1vh;
        overflow: hidden; /* Added to prevent unwanted scrolling */
      }

      .text {
        color: white;
        font-family: "Gazpacho", sans-serif;
        font-weight: 500;
        white-space: nowrap;
        line-height: 0.65;
        opacity: 0;
        clip-path: inset(0 0 0 0);
        margin: 0;
        padding: 0;
        text-align: center;
        position: absolute;
        left: 50%;
        width: 100%;
        /* Base size for all screens - will be overridden for larger screens */
        font-size: max(12rem, min(32vw, 32rem));
        letter-spacing: calc(0.5rem + 1vw);
      }

      /* Tablet styles */
      @media screen and (min-width: 448px) {
        .text {
          font-size: max(12rem, min(16vw, 16rem));
          letter-spacing: calc(0.5rem + 0.5vw);
          line-height: 0.7;
        }
      }

      /* Desktop styles */
      @media screen and (min-width: 768px) {
        .text {
          font-size: max(8rem, min(8vw, 8rem));
          letter-spacing: 0.5rem;
          line-height: 0.8;
        }
      }

      /* Base positioning for both GIGA and DOT */
      .giga-text, .dot-text {
        top: 50%;
        transform: translate(-50%, calc(-50% + 20vh));
      }

      /* Mobile-specific adjustments */
      @media screen and (max-width: 447px) {
        .text {
          line-height: 0.5;
        }
        
        .giga-text, .dot-text {
          transform: translate(-50%, calc(-50% + 15vh));
        }
      }

      .giga-text {
        transform: translate(-50%, calc(-50% + 20vh)); /* Offset from center */
      }

      .dot-text {
        position: absolute;
        opacity: 0;
        transform: translate(-50%, calc(-50% + 20vh)); /* Match GIGA text offset */
      }

      .svg-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw; /* Changed from 100% to ensure full viewport width */
        height: 100vh; /* Changed from 100% to ensure full viewport height */
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        align-items: center;
        opacity: 0;
        overflow: hidden;
      }

      .physics-world {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw; /* Changed from 100% to ensure full viewport width */
        height: 100vh; /* Changed from 100% to ensure full viewport height */
        overflow: hidden;
      }

      .svg-ball {
        position: absolute;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        visibility: hidden;
      }

      .svg-row {
        display: flex;
        width: 100%;
        justify-content: center;
      }

      .svg-item {
        width: 120px;
        height: 120px;
        margin: 10px;
        opacity: 0;
        transform: scale(0.8);
        clip-path: inset(0 0 0 0);
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .svg-item svg {
        width: 100%;
        height: 100%;
      }

      .spacer {
        height: 800vh; /* Changed from 1000vh */
      }

      .dot-text {
        position: absolute;
        opacity: 0;
      }

      .gidadot-text {
        position: absolute;
        color: white;
        font-family: "Gazpacho", sans-serif;
        font-weight: 500;
        white-space: nowrap;
        opacity: 0;
        font-size: clamp(2rem, 4vw, 4rem);
        transform-origin: center center;
        text-align: center;
        width: 100%;
        letter-spacing: 0.5rem;
        mix-blend-mode: difference;
      }

      .gidadot-container {
        position: fixed; /* Changed from absolute to fixed */
        top: 0;
        left: 0;
        width: 100vw; /* Changed from 100% to ensure full viewport width */
        height: 100vh; /* Changed from 100% to ensure full viewport height */
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        z-index: 10;
        overflow: hidden; /* Added to prevent unwanted scrolling */
      }

      .gigadot-image {
        max-width: 80%;
        max-height: 80vh;
        width: auto;
        height: auto;
        object-fit: contain;
        display: block;
        margin: auto;
      }

      .bg-transition {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: black;
        opacity: 0;
        pointer-events: none;
        /* z-index: 0; */ /* This is optional, but ensures it's below */
      }

      /* Spiral SVG Animation Styles */
      .spiral-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
      }

      .spiral-svg-piece {
        position: absolute;
        opacity: 0;
        transform-origin: center center;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      .spiral-svg-wrapper {
        position: absolute;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        top: 0;
        left: 0;
      }

      .svg-background {
        filter: none;
      }

      .svg-dot {
        filter: blur(0px);
      }

      .black-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.1); /* Semi-transparent instead of solid black */
        opacity: 0;
        z-index: 10;
      }

      /* Force Field Cursor Styles */
      .force-field-indicator {
        position: fixed;
        pointer-events: none;
        transform: translate(-50%, -50%);
        z-index: 1000;
        opacity: 0;
      }
      
      /* Available section styles - Improved for smoother animation */
      .available-section {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        opacity: 0;
        background-color: #F6297C;
        text-decoration: none;
        cursor: default;
        border-radius: 0;
        transition: all 0.3s ease;
        z-index: 100;
        pointer-events: none !important;
        /* Fix for Safari and mobile browsers */
        transform-origin: center center;
      }

      .available-text {
        color: white;
        font-family: "Gazpacho", sans-serif;
        font-size: clamp(2.5rem, 6vw, 3rem); /* Increased base size for mobile */
        opacity: 0;
        transform: translateY(30px);
        display: flex;
        align-items: center;
        gap: 1.5rem; /* Increased gap */
        margin: 0;
        white-space: nowrap;
        pointer-events: none;
      }
      
      .avalanche-logo {
        opacity: 0;
        transform: scale(0.8);
        height: clamp(2.5rem, 6vw, 3rem);
        display: flex;
        align-items: center;
        pointer-events: none;
      }

      .avalanche-logo svg {
        height: 100%;
        width: auto;
        transform: translateY(2px);
      }

      /* Button hover effect - only applies after transformation */
      .available-section.button-active {
        pointer-events: auto !important;
        cursor: pointer;
        width: auto;
        height: auto;
        padding: clamp(2rem, 4vw, 2.5rem) clamp(3rem, 6vw, 4rem);
        border-radius: 100px;
        /* No need to modify transform here as it's already centered */
      }

      /* Mobile styles */
      @media (max-width: 767px) {
        .available-text {
          font-size: clamp(3rem, 8vw, 4rem);
          gap: 2rem;
        }
        
        .avalanche-logo {
          height: clamp(3rem, 8vw, 4rem);
        }

        .avalanche-logo svg {
          height: 100%;
          width: auto;
          transform: translateY(4px) scale(1.2); /* Increased Y offset and scale for better proportion */
        }

        .available-section.button-active {
          padding: clamp(3rem, 6vw, 4rem) clamp(4rem, 8vw, 5rem);
          border-radius: 4rem;
        }
      }

      /* Desktop styles */
      @media (min-width: 768px) {
        .available-section.button-active {
          border-radius: 100px;
        }

        .avalanche-logo svg {
          height: 100%;
          width: auto;
          transform: translateY(2px);
        }
      }

      .spiral-image-container {
        position: fixed; /* Changed from absolute to fixed */
        top: 0;
        left: 0;
        width: 100vw; /* Changed from 100% to ensure full viewport width */
        height: 100vh; /* Changed from 100% to ensure full viewport height */
        perspective: 1000px;
        transform-style: preserve-3d;
        z-index: 1;
        overflow: hidden; /* Added to prevent unwanted scrolling */
      }

      .spiral-image-clone {
        position: absolute;
        max-width: min(80px, 20vw); /* Added responsive sizing */
        height: auto;
        object-fit: contain;
        transform-origin: center center;
        opacity: 0;
        scale: 0.1;
        pointer-events: none;
        backface-visibility: hidden;
        will-change: transform;
        border-radius: 8%;
      }

      /* ADD THESE STYLES */
      .liquidated-text {
        position: fixed;
        top: 50vh; /* Changed to vh units */
        left: 50%;
        transform: translate(-50%, -50%);
        color: #FFFFFF;
        font-family: "Gazpacho", sans-serif;
        font-size: clamp(1.5rem, 6vw, 3rem); /* Adjusted for better mobile scaling */
        font-weight: 700;
        white-space: nowrap;
        text-align: center;
        opacity: 0;
        z-index: 1000;
        mix-blend-mode: difference;
        text-shadow: 0 0 10px rgba(255,255,255,0.5);
        letter-spacing: 0.1em;
        pointer-events: none;
        width: 100%;
        padding: 0 20px;
        box-sizing: border-box;
      }

      /* ADD SCROLL INDICATOR STYLES */
      .scroll-indicator {
        position: fixed;
        bottom: 10vh;
        left: 50%;
        transform: translateX(-50%);
        color: #999999;
        font-family: "Gazpacho", sans-serif;
        font-size: clamp(1rem, 3vw, 1.5rem);
        text-align: center;
        z-index: 10;
        opacity: 1;
        transition: opacity 0.3s ease;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .scroll-indicator.hidden {
        opacity: 0;
      }

      .arrow-down {
        width: clamp(20px, 5vw, 40px);
        height: clamp(20px, 5vw, 40px);
        border-left: 2px solid #999999;
        border-bottom: 2px solid #999999;
        transform: rotate(-45deg);
        margin-top: 10px;
        animation: bounce 2s infinite;
      }

      @keyframes bounce {
        0%, 20%, 50%, 80%, 100% {
          transform: translateY(0) rotate(-45deg);
        }
        40% {
          transform: translateY(-10px) rotate(-45deg);
        }
        60% {
          transform: translateY(-5px) rotate(-45deg);
        }
      }

      /* FIX AVAILABLE SECTION STYLES - Updated */
      .available-section {
        position: fixed;
        top: 50%;
        left: 0; /* Changed from 50% */
        transform: translate(0, -50%); /* Changed from translate(-50%, -50%) */
        width: 100%; /* Changed from 100vw */
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        opacity: 0;
        background-color: #F6297C;
        text-decoration: none;
        cursor: default;
        border-radius: 0;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        z-index: 100;
        pointer-events: none; /* Disable pointer events initially */
      }

      .available-section.button-active {
        pointer-events: auto; /* Enable pointer events */
        cursor: pointer; /* Show pointer cursor */
        width: auto;
        height: auto;
        padding: clamp(2rem, 4vw, 2.5rem) clamp(3rem, 6vw, 4rem);
        border-radius: 100px;
        left: 50%; /* Add back for button state */
        transform: translate(-50%, -50%); /* Add back for button state */
      }

      .available-section.button-active:hover {
        transform: translate(-50%, -50%) scale(1.05);
        box-shadow: 0 0 30px rgba(246, 41, 124, 0.5);
      }
    </style>
  </head>
  <body>
    <!-- Add preload image -->
    <img id="gigadot-preload" src="images/gigadot-1.jpg" style="display: none;" alt="GIGADOT preload">
    
    <!-- Add scroll indicator -->
    <div class="scroll-indicator">
      <div>Scroll down for liquidity</div>
      <div class="arrow-down"></div>
    </div>
    
    <div class="scroll-container"></div>
    <div class="gidadot-container"> <!-- Existing container -->
        <div class="spiral-image-container">
            <!-- spiral clones go here -->
        </div>
        <div class="bg-transition"></div>

        <!-- MOVED TEXT ELEMENT OUTSIDE -->
        <!-- <div class="liquidated-text">Are you hydrated?</div> -->

    </div> <!-- End gidadot-container -->
    <div class="spacer"></div>

    <!-- MOVED TEXT ELEMENT HERE, before closing body -->
    <div class="liquidated-text">Are you hydrated?</div>

    <script>
      gsap.registerPlugin(ScrollTrigger);

      window.addEventListener("load", () => {
        // Configuration constants
        const config = {
          numDuplicates: 10,
          maxBalls: window.innerWidth < 768 ? 200 : 400, // Reduced balls for mobile
          maxFillPercentage: window.innerWidth < 768 ? 40 : 60, // Reduced fill for mobile
          numGidadotLayers: 5,
          physicsScrollRange: {
            start: 0.5,
            end: 0.9,
            fadePoint: 0.8,
          },
        };

        // Handle scroll indicator visibility
        const scrollIndicator = document.querySelector(".scroll-indicator");
        let scrollTimeout;
        
        function hideScrollIndicator() {
          scrollIndicator.classList.add("hidden");
        }
        
        window.addEventListener("scroll", () => {
          // Hide indicator immediately on any scroll
          if (window.scrollY > 50) { // Add small threshold for accidental scroll
            hideScrollIndicator();
          }
          
          // Clear previous timeout
          clearTimeout(scrollTimeout);
          
          // Show indicator again if back at top after 1.5 seconds without scrolling
          scrollTimeout = setTimeout(() => {
            if (window.scrollY < 50) {
              scrollIndicator.classList.remove("hidden");
            }
          }, 1500);
        });

        // Helper function to get viewport dimensions
        function getViewportSize() {
          return {
            width: window.innerWidth,
            height: window.innerHeight
          };
        }

        // Update viewport size on resize
        window.addEventListener('resize', () => {
          const viewport = getViewportSize();
          if (render) {
            render.canvas.width = viewport.width;
            render.canvas.height = viewport.height;
          }
        });

        const container = document.querySelector(".scroll-container");
        const gigaTexts = [];
        const dotTexts = [];
        
        // SVG markup for icons - used in multiple places
        const svgMarkup = `<svg width="58" height="60" viewBox="0 0 31 35" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M21.0882 13.8387C22.7451 15.571 23.2694 17.7539 22.2611 18.7185C21.2528 19.6831 19.0926 19.0589 17.438 17.33C15.7834 15.6011 15.2569 13.4148 16.2652 12.4502C17.2735 11.4856 19.4342 12.1098 21.0882 13.8387Z" fill="white"/>
          <path d="M7.34995 26.9802C9.00681 28.7125 9.53104 30.8953 8.52274 31.8599C7.51444 32.8246 5.35428 32.2004 3.6997 30.4709C2.04511 28.7414 1.5186 26.5557 2.5269 25.5911C3.5352 24.6265 5.69593 25.2507 7.34995 26.9802Z" fill="white"/>
          <path d="M14.054 28.9377C16.3804 28.3703 18.5366 29.0063 18.8674 30.3562C19.1982 31.7061 17.5805 33.2671 15.2518 33.8362C12.9231 34.4053 10.7692 33.7675 10.4384 32.4176C10.1076 31.0678 11.7247 29.5068 14.054 28.9377Z" fill="white"/>
          <path d="M4.48805 15.3249C5.82602 15.7148 6.36731 17.8988 5.69776 20.1974C5.02821 22.496 3.39808 24.0439 2.06011 23.6541C0.722141 23.2643 0.181347 21.0808 0.850332 18.7822C1.51932 16.4836 3.15008 14.934 4.48805 15.3249Z" fill="white"/>
          <path d="M22.7395 20.6546C24.0775 21.0444 24.616 23.225 23.9436 25.5265C23.2712 27.8279 21.6438 29.3736 20.3059 28.9837C18.9679 28.5939 18.4299 26.4128 19.1018 24.1119C19.7736 21.811 21.3992 20.2648 22.7395 20.6546Z" fill="white"/>
          <path d="M27.8138 4.53656C29.4707 6.26889 29.995 8.45176 28.9867 9.41637C27.9784 10.381 25.8182 9.75682 24.1636 8.02734C22.509 6.29785 21.9825 4.11214 22.9908 3.14753C23.9991 2.18292 26.1598 2.80707 27.8138 4.53656Z" fill="#979FAA"/>
          <path d="M14.0745 17.6774C15.7314 19.4097 16.2557 21.5926 15.2474 22.5572C14.2391 23.5218 12.0789 22.8977 10.4244 21.1687C8.76977 19.4398 8.24319 17.2536 9.25149 16.289C10.2598 15.3244 12.4205 15.9491 14.0745 17.6774Z" fill="#979FAA"/>
          <path d="M16.2678 1.16389C18.5942 0.596472 20.7504 1.23253 21.0812 2.58922C21.412 3.94592 19.7915 5.50349 17.4656 6.06978C15.1398 6.63606 12.983 6.00111 12.6522 4.64441C12.3214 3.28772 13.9419 1.73017 16.2678 1.16389Z" fill="#979FAA"/>
          <path d="M20.7787 19.6375C23.1051 19.0701 25.2612 19.7062 25.592 21.056C25.9228 22.4059 24.3051 23.9674 21.9765 24.5366C19.6478 25.1057 17.4938 24.4679 17.163 23.118C16.8322 21.7681 18.4494 20.2049 20.7787 19.6375Z" fill="#979FAA"/>
          <path d="M11.2127 6.01908C12.5506 6.40889 13.0919 8.59231 12.4224 10.8909C11.7528 13.1895 10.1226 14.738 8.78467 14.3482C7.4467 13.9584 6.90597 11.7744 7.57496 9.47633C8.24394 7.17829 9.8747 5.63153 11.2127 6.01908Z" fill="#979FAA"/>
          <path d="M29.4624 11.3529C30.8004 11.7427 31.3388 13.9233 30.6664 16.2248C29.994 18.5262 28.3667 20.0719 27.0288 19.682C25.6908 19.2922 25.1523 17.1116 25.8247 14.8102C26.4971 12.5088 28.1244 10.962 29.4624 11.3529Z" fill="#979FAA"/>
          <path d="M9.54324 10.4666C11.8697 9.89916 14.0258 10.5347 14.3566 11.8919C14.6874 13.2492 13.0674 14.8062 10.741 15.3725C8.41462 15.9387 6.25842 15.3038 5.92762 13.9471C5.59681 12.5904 7.2174 11.0329 9.54324 10.4666Z" fill="white"/>
        </svg>`;

        // Helper function to create elements with attributes
        function createElement(tag, className, parent, properties = {}) {
          const element = document.createElement(tag);
          if (className) element.className = className;
          if (parent) parent.appendChild(element);

          // Set additional properties
          Object.entries(properties).forEach(([key, value]) => {
            if (key === "style") {
              Object.entries(value).forEach(([styleKey, styleValue]) => {
                element.style[styleKey] = styleValue;
              });
            } else if (key === "attributes") {
              Object.entries(value).forEach(([attrKey, attrValue]) => {
                element.setAttribute(attrKey, attrValue);
              });
            } else {
              element[key] = value;
            }
          });

          return element;
        }

        // Setup containers and elements
        const gidadotContainer = createElement(
          "div",
          "gidadot-container",
          container
        );

        // Create a container for the spiral images
        const spiralImageContainer = createElement(
          "div",
          "spiral-image-container", // New container
          gidadotContainer
        );

        // Get the processed image path from the preloaded img
        const preloadImg = document.getElementById('gigadot-preload');
        const imgSrc = preloadImg ? preloadImg.src : 'images/gigadot-1.jpg';

        // ADD THIS LINE - Get reference to the new text element - Keep this reference if needed elsewhere, but we'll use selector in timeline
        const liquidatedText = document.querySelector(".liquidated-text");

        // --- Create Image Clones ---
        const numClones = 35; // How many images in the spiral
        const spiralClones = [];
        for (let i = 0; i < numClones; i++) {
          const clone = createElement(
            "img",
            "spiral-image-clone", // New class for clones
            spiralImageContainer,
            {
              attributes: {
                src: imgSrc,
                alt: "GIGADOT Clone"
              },
              // Initial style for positioning at the center
              style: {
                position: 'absolute',
                top: '50%',
                left: '50%',
                transform: 'translate(-50%, -50%) scale(0.1)', // Start small and centered
                opacity: 0 // Start invisible
              }
            }
          );
          spiralClones.push(clone);
        }
        // --- End Image Clones ---

        const bgTransition = createElement(
          "div",
          "bg-transition",
          gidadotContainer
        );

        // Create GIGA and DOT text elements with viewport-based positioning
        for (let i = 0; i < config.numDuplicates; i++) {
          // Calculate vertical position based on viewport height
          const verticalPosition = (i / (config.numDuplicates - 1)) * 85 + 7.5; // Spread across 85% of viewport height, offset by 7.5% from top and bottom

          const gigaText = createElement("div", "text giga-text", container, {
            textContent: "GIGA",
            style: {
              top: `${verticalPosition}vh`, // Set vertical position using vh units
            }
          });
          gigaTexts.push(gigaText);

          const dotText = createElement("div", "text dot-text", container, {
            textContent: "DOT",
            style: {
              position: "absolute",
              opacity: "0",
              top: `${verticalPosition}vh`, // Match GIGA text position
            },
          });
          dotTexts.push(dotText);
        }

        // Create physics container
        const svgContainer = createElement("div", "svg-container", container);
        const physicsWorld = createElement(
          "div",
          "physics-world",
          svgContainer
        );

        // Initialize physics variables
        let engine, render, world;
        let balls = [];
        let ballCount = 0;
        let isPhysicsRunning = false;
        let wasInView = false;
        
        // Force field variables
        let attractiveForce = 0.0005; // Strength of attraction
        let attractionRadius = 400; // Fixed radius
        let mousePosition = { x: 0, y: 0 };
        let isAttracting = true;
        let isForceFieldActive = false;
        
        // Create force field indicator (invisible, just for tracking)
        const forceFieldIndicator = createElement('div', 'force-field-indicator', document.body);
        
        // Track mouse position
        document.addEventListener('mousemove', (event) => {
          mousePosition.x = event.clientX;
          mousePosition.y = event.clientY;
          
          if (forceFieldIndicator) {
            forceFieldIndicator.style.left = mousePosition.x + 'px';
            forceFieldIndicator.style.top = mousePosition.y + 'px';
          }
        });
        
        // Toggle attraction/repulsion with click
        document.addEventListener('click', () => {
          if (!isForceFieldActive) return;
          
          isAttracting = !isAttracting;
          attractiveForce = isAttracting ? 
            Math.abs(attractiveForce) : 
            -Math.abs(attractiveForce);
        });

        // Physics setup function
        function setupPhysics() {
          // Create engine with reduced gravity
          engine = Matter.Engine.create({
            gravity: { x: 0, y: 1, scale: 0.001 },
          });
          world = engine.world;

          // Create invisible renderer for collision detection
          render = Matter.Render.create({
            element: physicsWorld,
            engine: engine,
            options: {
              width: window.innerWidth,
              height: window.innerHeight,
              wireframes: true,
              showCollisions: false,
              showAngleIndicator: false,
              visible: false,
            },
          });

          // Create wall options - low bounciness
          const wallOptions = {
            isStatic: true,
            restitution: 0.3,
            friction: 0.2,
          };

          // Create container walls
          const walls = [
            // Bottom wall
            Matter.Bodies.rectangle(
              window.innerWidth / 2,
              window.innerHeight + 50,
              window.innerWidth * 2,
              100,
              wallOptions
            ),
            // Left wall
            Matter.Bodies.rectangle(
              -50,
              window.innerHeight / 2,
              100,
              window.innerHeight * 2,
              wallOptions
            ),
            // Right wall
            Matter.Bodies.rectangle(
              window.innerWidth + 50,
              window.innerHeight / 2,
              100,
              window.innerHeight * 2,
              wallOptions
            ),
          ];

          Matter.Composite.add(world, walls);

          // Add mouse interaction
          const mouse = Matter.Mouse.create(render.canvas);
          const mouseConstraint = Matter.MouseConstraint.create(engine, {
            mouse: mouse,
            constraint: {
              stiffness: 0.2,
              render: { visible: false },
            },
          });

          Matter.Composite.add(world, mouseConstraint);
          Matter.Runner.run(engine);

          isPhysicsRunning = true;
          requestAnimationFrame(updateSvgPositions);
        }

        // Create a new physics ball
        function createBall() {
          if (ballCount >= config.maxBalls) return null;

          const viewport = getViewportSize();
          const isMobile = viewport.width < 768;
          
          // Responsive radius calculation
          const baseRadius = isMobile ? 15 : 25;
          const radius = baseRadius + Math.random() * (isMobile ? 10 : 20);
          
          const x = Math.random() * (viewport.width - radius * 2) + radius;
          const y = -radius * 4;

          // Create physics body with low bounce
          const ball = Matter.Bodies.circle(x, y, radius, {
            restitution: 0.3 + Math.random() * 0.2,
            friction: 0.1 + Math.random() * 0.1,
            density: 0.001 + Math.random() * 0.002,
            frictionAir: 0.001 + Math.random() * 0.003,
          });

          Matter.Composite.add(world, ball);

          // Create and style SVG element with responsive sizing
          const svgElement = createElement("div", "svg-ball", physicsWorld, {
            innerHTML: svgMarkup,
            style: {
              width: `${radius * 2}px`,
              height: `${radius * 2}px`,
              transform: `rotate(${Math.random() * 360}deg)`,
            },
          });

          // Scale SVG viewBox with element size
          const svg = svgElement.querySelector("svg");
          svg.setAttribute("width", `${radius * 2}px`);
          svg.setAttribute("height", `${radius * 2}px`);
          svg.setAttribute("viewBox", "-14.5 -15 58 60");

          balls.push({
            body: ball,
            element: svgElement,
            radius: radius,
          });

          ballCount++;
          return ball;
        }

        // Update SVG positions based on physics
        function updateSvgPositions() {
          if (!isPhysicsRunning) return;
          
          balls.forEach(ball => {
            const pos = ball.body.position;
            
            // Set position
            ball.element.style.left = `${pos.x - ball.radius}px`;
            ball.element.style.top = `${pos.y - ball.radius}px`;
            ball.element.style.visibility = 'visible';
            
            // Update rotation from physics
            const rotation = ball.body.angle * (180 / Math.PI);
            const currentTransform = ball.element.style.transform;
            const newTransform = currentTransform.includes('rotate') 
              ? currentTransform.replace(/rotate\([^)]+\)/, `rotate(${rotation}deg)`)
              : `${currentTransform} rotate(${rotation}deg)`;
            ball.element.style.transform = newTransform;
          });
          
          // Apply force field if active
          if (isForceFieldActive && isPhysicsRunning) {
            applyForceField();
          }
          
          requestAnimationFrame(updateSvgPositions);
        }
        
        // Apply force field to physics objects
        function applyForceField() {
          balls.forEach(ball => {
            const body = ball.body;
            const pos = body.position;
            
            // Calculate distance to cursor
            const dx = mousePosition.x - pos.x;
            const dy = mousePosition.y - pos.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            // Apply force if within attraction radius
            if (distance < attractionRadius) {
              // Strength increases as objects get closer to cursor
              const forceMagnitude = attractiveForce * (1 - distance / attractionRadius);
              
              Matter.Body.applyForce(body, pos, {
                x: dx * forceMagnitude,
                y: dy * forceMagnitude
              });
            }
          });
        }

        // Calculate viewport fill percentage
        function getViewportFillPercentage() {
          let totalBallArea = 0;
          const viewportArea = window.innerWidth * window.innerHeight;

          balls.forEach((ball) => {
            const pos = ball.body.position;

            // Check if in viewport
            if (
              pos.y + ball.radius > 0 &&
              pos.y - ball.radius < window.innerHeight &&
              pos.x + ball.radius > 0 &&
              pos.x - ball.radius < window.innerWidth
            ) {
              totalBallArea += Math.PI * ball.radius * ball.radius;
            }
          });

          return (totalBallArea / viewportArea) * 100;
        }

        // Clean up physics bodies and elements
        function resetPhysics() {
          balls.forEach((ball) => {
            Matter.Composite.remove(world, ball.body);
            if (ball.element && ball.element.parentNode) {
              ball.element.parentNode.removeChild(ball.element);
            }
          });

          balls = [];
          ballCount = 0;
        }

        // Handle physics section with scroll
        function handleScrollPhysics(scrollProgress) {
          const { start, end, fadePoint } = config.physicsScrollRange;
          const inPhysicsSection = scrollProgress >= start && scrollProgress <= end;
          
          if (inPhysicsSection) {
            // Show container and initialize physics
            gsap.to(svgContainer, { opacity: 1, duration: 0.3 });
            
            // Show force field indicator when in physics section
            if (!isForceFieldActive) {
              isForceFieldActive = true;
              gsap.set(forceFieldIndicator, { 
                width: attractionRadius * 2, 
                height: attractionRadius * 2
              });
            }
            
            if (!isPhysicsRunning) {
              setupPhysics();
            }

            // Calculate section progress
            const sectionProgress = (scrollProgress - start) / (end - start);
            const fillPercentage = getViewportFillPercentage();
            const targetBallCount = Math.ceil(
              config.maxBalls * sectionProgress * 4 // Increased multiplier from 1.5 to 2
            );
            const shouldFade = sectionProgress > fadePoint;

            if (!shouldFade) {
              // Generate balls phase
              if (
                fillPercentage < config.maxFillPercentage &&
                ballCount < Math.min(targetBallCount, config.maxBalls)
              ) {
                // Gradual generation - increased probability
                if (Math.random() < 2.5) { // Increased from 0.3 to 0.5
                  createBall();
                }
              }
            } else {
              // Fade out phase
              const fadeProgress =
                (sectionProgress - fadePoint) / (1 - fadePoint);

              // Apply effects to each ball
              balls.forEach((ball) => {
                const targetOpacity = 1 - fadeProgress;
                const blurAmount = fadeProgress * 10;
                const scaleAmount = 1 - fadeProgress * 0.3;

                ball.element.style.opacity = Math.max(0, targetOpacity);
                ball.element.style.filter = `blur(${blurAmount}px)`;

                // Extract rotation safely
                let rotation = 0;
                const currentTransform = ball.element.style.transform;
                const rotateMatch = currentTransform.match(/rotate\(([^)]+)\)/);
                if (rotateMatch && rotateMatch[1]) {
                  rotation = rotateMatch[1];
                } else {
                  rotation = ball.body.angle * (180 / Math.PI) + "deg";
                }

                ball.element.style.transform = `rotate(${rotation}) scale(${scaleAmount})`;
              });
            }

            wasInView = true;
          } else {
            // Clean up when leaving section
            if (wasInView) {
              resetPhysics();
              isPhysicsRunning = false;
              gsap.to(svgContainer, { opacity: 0, duration: 0.3 });
              
              // Hide force field indicator when leaving physics section
              if (isForceFieldActive) {
                isForceFieldActive = false;
                gsap.set(forceFieldIndicator, { 
                  width: 0, 
                  height: 0
                });
              }
              
              wasInView = false;
            }
          }
        }

        // Position DOT texts to match GIGA positions - No longer needed as we're using vh units
        function updateDotPositions() {
          // This function can be simplified since we're using vh units
          // Only update if dynamic repositioning is needed
          gigaTexts.forEach((giga, index) => {
            if (dotTexts[index].style.top !== giga.style.top) {
              dotTexts[index].style.top = giga.style.top;

          });
        }

        // Remove the spacer height from CSS
        const spacer = document.querySelector('.spacer');
        spacer.style.height = 'auto'; // Let ScrollTrigger handle the height

        // Update scroll trigger configuration with responsive values
        const tl = gsap.timeline({
          scrollTrigger: {
            trigger: ".scroll-container",
            start: "top top",
            end: window.innerWidth < 768 ? "+=6000" : "+=8000", // Adjusted for mobile
            scrub: window.innerWidth < 768 ? 1 : 1.5, // Adjusted for mobile
            pin: true,
            onUpdate: function (self) {
              updateDotPositions();
              handleScrollPhysics(self.progress);
            },
          },
        });

        // Initial states (GIGA/DOT/SVG container) - remain the same
        gsap.set(gigaTexts, { opacity: 0, y: "10vh" });
        gsap.set(dotTexts, { opacity: 0, clipPath: "inset(0 0 100% 0)" });
        gsap.set(svgContainer, { opacity: 0 });
        gsap.set(gidadotContainer, { opacity: 0 }); // Ensure container starts hidden

        // Update the animation timeline for GIGA text
        gigaTexts.forEach((text, index) => {
          // Fade in with proper vertical movement
          tl.to(
            text,
            {

            },

          );

          tl.to(
            text,
            {

              opacity: 0,
              duration: 0.3,
              ease: "power2.in",
            },
            ">+0.2"
          );
        });

        // Update the animation timeline for DOT text
        dotTexts.forEach((text, index) => {
          // Fade in
          tl.to(
            text,
            {
              opacity: 1,
              clipPath: "inset(0 0 0 0)",
              y: 0,
              duration: 0.3,
              ease: "power2.out",
            },
            ">-0.1"
          );

          // Clip out
          tl.to(
            text,
            {
              clipPath: "inset(0 0 100% 0)",
              opacity: 0,
              duration: 0.3,
              ease: "power2.in",
            },
            ">+0.2"
          );
        });

        // --- Spiral Image Animation Section ---
        const spiralSectionStartTime = tl.duration();
        const spiralAnimationDuration = 6.0; // Increased from 3.0 for smoother animation
        const maxSpiralRadius = Math.min(window.innerWidth, window.innerHeight) * 0.8; // Reduced from 1.0 for better visibility

        // 1. Fade in the white background FIRST
        tl.to(bgTransition, {
          opacity: 1,
            duration: 0.6 // Duration for background fade-in
        }, spiralSectionStartTime);

        // 2. THEN, fade in the spiral container (slightly delayed or starting after bg)
        tl.to(gidadotContainer, {
            opacity: 1,
            duration: 0.4 // Duration for container fade-in
        }, ">-0.2"); // Start this 0.2s before the background fade finishes for overlap

        // === ADD TEXT FADE IN ===
        // Fade in text slightly after spiral container appears
        tl.to(liquidatedText, {
            opacity: 1,
            duration: 1.0, // Duration for text fade-in
            ease: "power1.in"
        }, spiralSectionStartTime + 1.0); // Start 1s after spiral section starts

        // 3. Create a progress tracker and run the main spiral animation
        const spiralProgress = { value: 0 };
        tl.to(spiralProgress, {
          value: 0.1,
          duration: spiralAnimationDuration,
          ease: "power1.inOut",
          onUpdate: () => {
            // ... (onUpdate logic for setting image properties) ...
            spiralClones.forEach((clone, index) => {
              const data = calculateSpiralData(
                spiralProgress.value,

                maxSpiralRadius
              );

              gsap.set(clone, {
                x: data.x,
                y: data.y,
                rotation: data.rotationZ,
                rotationX: data.rotationX,
                rotationY: data.rotationY,
                skewX: data.skewX,
                skewY: data.skewY,
                scale: data.scale,
                opacity: data.opacity,
                transformOrigin: "center center",
                transformPerspective: 1000
              });
            });
          }
        }, spiralSectionStartTime + 0.6); // Keep original timing relative to background

        // === ADD TEXT FADE OUT ===
        // Start fading out text before the container fades out completely
        const textFadeOutStartTime = spiralSectionStartTime + 0.6 + spiralAnimationDuration * 0.7; // Start fading out 70% through spiral anim
        tl.to(liquidatedText, {
          opacity: 0,
            duration: 1.0, // Duration for text fade-out
            ease: "power1.out"
        }, textFadeOutStartTime);

        // 4. Fade out BOTH the container and the background at the end
        const fadeOutStartTime = spiralSectionStartTime + 0.6 + spiralAnimationDuration * 0.9; // Adjust start time based on when spiral anim starts
        tl.to(gidadotContainer, { // Fade out spiral container
          opacity: 0,

        }, fadeOutStartTime);
        tl.to(bgTransition, { // Fade out background
            opacity: 0,
            duration: 1.0 // Slightly longer fade for background
        }, ">-0.6"); // Start fading background slightly before container finishes fading

        // Add a small gap before next section
        tl.to({}, { duration: 0.3 });

        // Reserve space for physics animation - keep this gap
        tl.to({}, { duration: 0.5 });

        // Create spiral animation elements (for the *other* SVG spiral) - remains the same
        const spiralContainer = createElement(
          "div",

        const blackOverlay = createElement("div", "black-overlay", container);
        const spiralWrapper = createElement(

          {

            }

            const radius = maxRadius * t;
            return {

          });

          const y = radius * Math.sin(angle);
          const angleToCenter = Math.atan2(y, x);
          const rotationZ = (angleToCenter * 180 / Math.PI) + 90;
          const rotationX = 5 * Math.sin(angle);
          const rotationY = 5 * Math.cos(angle);
          const distanceFromCenter = Math.sqrt(x * x + y * y);
          const maxDistance = maxRadius * 1.2;
          const distanceFactor = Math.min(1, distanceFromCenter / maxDistance); // 0 near center, 1 further out
          const skewX = 15 * Math.sin(angleToCenter) * distanceFactor;
          const skewY = 15 * Math.cos(angleToCenter) * distanceFactor;

          // --- New Scale & Opacity Logic ---

          // 1. Smoother Eased Fade-In Factor
          // Starts slow, ramps up. Adjust multiplier (3) or exponent (2) to tune speed.
          const emergenceFactor = Math.min(1, Math.pow(t * 5, 9));

          // 2. Perspective Scaling Factor
          // Starts small near center (distanceFactor=0), grows towards 1 further out.
          const minScaleAtCenter = 2; // How small images are at the very center
          const maxScaleFurtherOut = 2.0; // Target scale as images move away
          const perspectiveScaleFactor = minScaleAtCenter + (maxScaleFurtherOut - minScaleAtCenter) * distanceFactor;

          // Combine factors: Apply emergence fade-in to the perspective scale
          const scale = perspectiveScaleFactor * emergenceFactor;

          // Apply emergence factor directly to opacity for the smooth fade-in
          const opacity = emergenceFactor;

          // --- End of New Logic ---

          return {
            x,
            y,
            rotationX,
            rotationY,
            rotationZ,
            skewX,
            skewY,
            scale,    // Use the new perspective-aware, faded-in scale
            opacity   // Use the new faded-in opacity
          };
        }

        // Create spiral animation with separate ScrollTrigger
        ScrollTrigger.create({
          trigger: ".scroll-container",
          start: "top top",
          end: "+=4000", // Adjust this value to control how long the spiral section takes to scroll
          scrub: 2.5, // Higher scrub value for smoother spiral movement
          onUpdate: (self) => {
            // Update spiral images based on scroll progress
            spiralClones.forEach((clone, index) => {
              const data = calculateSpiralData(
                self.progress, // Use ScrollTrigger progress directly
                index,
                spiralClones.length,
                maxSpiralRadius
              );

              gsap.set(clone, {
                x: data.x,
                y: data.y,
                rotation: data.rotationZ,
                rotationX: data.rotationX,
                rotationY: data.rotationY,
                skewX: data.skewX,
                skewY: data.skewY,
                scale: data.scale,
                opacity: data.opacity,
                transformOrigin: "center center",
                transformPerspective: 2000
              });
            });
          }
        });

        // Add animations to main timeline
        const textStartTime = spiralSectionStartTime + 1;
        // REMOVED: const textEndTime = spiralSectionStartTime + spiralAnimationDuration - 2.5;
        const containerFadeOutTime = spiralSectionStartTime + spiralAnimationDuration - 1; // Keep this timing

        // Text animations - Keep the fade-in
        tl.to(".liquidated-text", {
          opacity: 1,
          duration: 1.5,
          ease: "power2.inOut",
          scale: 1.1,
          delay: 0.5
        }, textStartTime);

        // REMOVED: Independent text fade-out animation
        // tl.to(".liquidated-text", {
        //   opacity: 0,
        //   duration: 1.5,
        //   scale: 0.9,
        //   ease: "power2.inOut"
        // }, textEndTime);

        // Background and container animations
        tl.to(bgTransition, {
            opacity: 1,
            duration: 0.6
        }, spiralSectionStartTime);

        tl.to(gidadotContainer, {
            opacity: 1,
            duration: 0.4
        }, ">-0.2");

        // Fade out container, background, AND the text together
        tl.to([gidadotContainer, bgTransition, ".liquidated-text"], { // MODIFIED: Added ".liquidated-text" to the fade-out targets
            opacity: 0,
            duration: 0.8, // Use a consistent duration for the group fade-out
            stagger: 0.1 // Optional: slightly stagger the fade-out for a subtle effect
        }, containerFadeOutTime);

        // REMOVED: Separate fade-out for bgTransition as it's now handled above
        // tl.to(bgTransition, {
        //     opacity: 0,
        //     duration: 1.0
        // }, ">-0.6");

      }); // End window load listener
    </script>
  </body>
